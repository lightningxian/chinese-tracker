name: chinese_tracker
description: Professional Chinese teaching app — track students, progress, and lessons.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.0.0
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^10.3.10
  pdfrx: ^2.4.4
  archive: ^4.0.9
  xml: ^7.0.1
  image: ^4.9.1
  firebase_storage: ^13.4.3
  url_launcher: ^6.3.1
  table_calendar: ^3.1.2
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
