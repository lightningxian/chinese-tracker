name: chinese_tracker
description: Professional Chinese teaching app — track students, progress, and lessons.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  cloud_functions: ^6.0.0
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^10.3.10
  pdfrx: ^2.4.4
  archive: ^4.0.9
  xml: ^7.0.1
  image: ^4.9.1
  firebase_storage: ^13.4.3
  url_launcher: ^6.3.1
  table_calendar: ^3.1.2
  web: ^1.1.1
  firebase_ai: ^4.0.0
  just_audio: ^0.10.6
  firebase_app_check: ^0.4.9
  firebase_messaging: ^16.7.1
  qr_flutter: 4.1.0
  fl_chart: ^1.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Regenerates lib/l10n/generated from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/fonts/
    - assets/question_sets/
  # Owner 2026-11-26: Chinese text reads in a plain sans face, never bold:
  # Noto Sans SC Regular (OFL 1.1), cut to GB2312 + Latin/pinyin/punctuation
  # by tool/subset_reading_font.py (~2.5 MB). The same file stands in for
  # weight 700 so headings never draw a bold (or fake-bold) character. The
  # Kai files (LXGW WenKai) stay in assets/fonts/ but are no longer used.
  fonts:
    - family: Noto Sans SC Reading
      fonts:
        - asset: assets/fonts/NotoSansSC-Reading.ttf
        - asset: assets/fonts/NotoSansSC-Reading.ttf
          weight: 700
