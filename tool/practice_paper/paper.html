<!doctype html>
<!--
  Draws the practice HSK 3 paper of content.js as scan-like page pictures
  (docs/PLAN.md, Build 1C, Must 1a). build.mjs opens this file in headless
  Chrome and reads the pictures from #out. Open it in Chrome by hand to look
  at the pages.
-->
<html>
<head>
<meta charset="utf-8">
<title>Practice HSK 3 paper</title>
<style>body { margin: 0; background: #888; } canvas { display: block; margin: 8px auto; width: 600px; }</style>
</head>
<body>
<pre id="out" style="display:none"></pre>
<script src="content.js"></script>
<script>
(function () {
  // A4 at 200 dpi, like a desk scanner.
  const W = 1654, H = 2339, M = 150, FS = 38, LH = 66;
  const SERIF = 'SimSun, "Songti SC", "Noto Serif CJK SC", serif';
  const SANS = 'Arial, Helvetica, sans-serif';
  const P = window.PAPER;

  // Seeded random numbers, so every build gives the same paper.
  let seed = 20261118;
  function rnd() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  const pages = [];
  let ctx = null, y = 0;

  function watermark(c) {
    c.save();
    c.fillStyle = 'rgb(244,176,196)';
    c.font = `bold 92px ${SERIF}`;
    c.translate(W / 2, H / 2);
    c.rotate(-Math.PI / 6);
    for (let gy = -1800; gy <= 1800; gy += 420) {
      for (let gx = -1600; gx <= 1600; gx += 620) {
        c.fillText(P.watermark, gx + ((gy / 420) % 2 ? 300 : 0), gy);
      }
    }
    c.restore();
  }

  function newPage() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    watermark(ctx);
    pages.push(c);
    y = M;
  }

  function need(h) { if (y + h > H - M - 60) newPage(); }

  function font(size, bold, family) {
    ctx.font = `${bold ? 'bold ' : ''}${size}px ${family || SERIF}`;
  }

  function text(str, x, opts) {
    const o = opts || {};
    font(o.size || FS, o.bold, o.family);
    ctx.fillStyle = '#151515';
    ctx.fillText(str, x, y + (o.size || FS));
  }

  function line(str, opts) {
    const o = opts || {};
    need(LH);
    let x = o.x == null ? M : o.x;
    if (o.center) { font(o.size || FS, o.bold, o.family); x = (W - ctx.measureText(str).width) / 2; }
    text(str, x, o);
    y += o.height || LH;
  }

  // Wraps a sentence at the right margin; returns the lines.
  function wrap(str, x) {
    font(FS);
    const out = [];
    let cur = '';
    for (const ch of str) {
      if (ctx.measureText(cur + ch).width > W - M - x) { out.push(cur); cur = ch; } else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

  function numbered(n, str, opts) {
    const o = opts || {};
    const x = M + 90;
    const rows = wrap(str, x);
    need(LH * rows.length);
    text(`${n}.`, M, {family: SANS, size: 36});
    rows.forEach((r, i) => {
      text(r, x);
      if (i === rows.length - 1 && o.bracket) text('（    ）', W - M - 150);
      y += LH;
    });
  }

  // `A 在家   B 在学校   C 在医院` in fixed columns.
  function choiceRow(options, x0, n) {
    need(LH);
    if (n != null) text(`${n}.`, M, {family: SANS, size: 36});
    const col = (W - M - x0) / options.length;
    options.forEach((o, i) => {
      const x = x0 + i * col;
      text(String.fromCharCode(65 + i), x, {family: SANS, size: 36});
      text(o, x + 48);
    });
    y += LH;
  }

  function range(a, b) { line(`第 ${a}-${b} 题`, {bold: true}); y += 6; }

  function example(lines) {
    (lines || []).forEach((l) => line(l, {x: M + 20}));
    if ((lines || []).length) y += 10;
  }

  // Simple line drawings standing in for the photos of a real paper.
  function drawPicture(kind, x, y0, w, h) {
    const c = ctx;
    c.save();
    c.strokeStyle = '#202020'; c.lineWidth = 5; c.fillStyle = '#5a5a5a';
    const cx = x + w / 2, cy = y0 + h / 2;
    c.beginPath();
    switch (kind) {
      case 'house':
        c.rect(cx - 110, cy - 20, 220, 130); c.moveTo(cx - 140, cy - 10); c.lineTo(cx, cy - 120); c.lineTo(cx + 140, cy - 10);
        c.stroke(); c.fillRect(cx - 25, cy + 40, 50, 70); break;
      case 'tree':
        c.arc(cx, cy - 40, 90, 0, Math.PI * 2); c.stroke(); c.fillRect(cx - 18, cy + 45, 36, 80); break;
      case 'cup':
        c.rect(cx - 80, cy - 70, 160, 170); c.moveTo(cx + 80, cy - 30); c.arc(cx + 80, cy + 15, 45, -Math.PI / 2, Math.PI / 2);
        c.stroke(); c.fillRect(cx - 80, cy - 70, 160, 30); break;
      case 'car':
        c.rect(cx - 150, cy - 20, 300, 80); c.moveTo(cx - 90, cy - 20); c.lineTo(cx - 50, cy - 80); c.lineTo(cx + 60, cy - 80); c.lineTo(cx + 100, cy - 20);
        c.stroke(); c.beginPath(); c.arc(cx - 85, cy + 70, 32, 0, Math.PI * 2); c.arc(cx + 85, cy + 70, 32, 0, Math.PI * 2); c.fill(); break;
      case 'sun':
        c.arc(cx, cy, 60, 0, Math.PI * 2); c.fill();
        for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; c.moveTo(cx + Math.cos(a) * 80, cy + Math.sin(a) * 80); c.lineTo(cx + Math.cos(a) * 125, cy + Math.sin(a) * 125); }
        c.stroke(); break;
      case 'book':
        c.rect(cx - 140, cy - 90, 140, 180); c.rect(cx, cy - 90, 140, 180);
        for (let i = 0; i < 5; i++) { c.moveTo(cx - 115, cy - 50 + i * 30); c.lineTo(cx - 25, cy - 50 + i * 30); c.moveTo(cx + 25, cy - 50 + i * 30); c.lineTo(cx + 115, cy - 50 + i * 30); }
        c.stroke(); break;
      case 'umbrella':
        c.arc(cx, cy - 10, 130, Math.PI, 0); c.closePath(); c.fill(); c.beginPath(); c.moveTo(cx, cy - 10); c.lineTo(cx, cy + 110); c.arc(cx - 25, cy + 110, 25, 0, Math.PI); c.stroke(); break;
      case 'clock':
        c.arc(cx, cy, 110, 0, Math.PI * 2); c.moveTo(cx, cy); c.lineTo(cx, cy - 75); c.moveTo(cx, cy); c.lineTo(cx + 55, cy + 20);
        c.stroke(); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; c.fillRect(cx + Math.cos(a) * 92 - 5, cy + Math.sin(a) * 92 - 5, 10, 10); } break;
      case 'fish':
        c.ellipse(cx - 20, cy, 110, 60, 0, 0, Math.PI * 2); c.moveTo(cx + 85, cy); c.lineTo(cx + 150, cy - 55); c.lineTo(cx + 150, cy + 55); c.closePath();
        c.stroke(); c.beginPath(); c.arc(cx - 80, cy - 15, 12, 0, Math.PI * 2); c.fill(); break;
      case 'bike':
        c.arc(cx - 95, cy + 40, 60, 0, Math.PI * 2); c.moveTo(cx + 155, cy + 40); c.arc(cx + 95, cy + 40, 60, 0, Math.PI * 2);
        c.moveTo(cx - 95, cy + 40); c.lineTo(cx - 20, cy - 50); c.lineTo(cx + 60, cy - 50); c.lineTo(cx + 95, cy + 40); c.moveTo(cx - 20, cy - 50); c.lineTo(cx, cy + 40); c.lineTo(cx + 60, cy - 50);
        c.stroke(); break;
      case 'ball':
        c.arc(cx, cy, 110, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.moveTo(cx - 40, cy - 30); c.lineTo(cx + 40, cy - 30); c.lineTo(cx + 60, cy + 40); c.lineTo(cx, cy + 80); c.lineTo(cx - 60, cy + 40); c.closePath(); c.fill(); break;
    }
    c.restore();
  }

  function pictureBlock(b) {
    // A block of pictures takes a page of its own, as on the real paper.
    if (y > M + LH * 4) newPage();
    range(b.start, b.end);
    const cols = 3, bw = 380, bh = 300, gapX = (W - 2 * M - cols * bw) / (cols - 1);
    b.pictures.forEach((kind, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = M + col * (bw + gapX), yy = y + row * (bh + 80);
      ctx.save(); font(40, true, SANS); ctx.fillStyle = '#151515';
      ctx.fillText(String.fromCharCode(65 + i), x - 6, yy + 36); ctx.restore();
      drawPicture(kind, x + 40, yy + 10, bw - 40, bh - 20);
    });
    y += Math.ceil(b.pictures.length / cols) * (bh + 80) + 20;
    example(b.example);
    for (let n = b.start; n <= b.end; n++) { line(`${n}.`, {family: SANS, size: 36, height: LH + 40}); }
  }

  function cover() {
    newPage();
    y = 260;
    line(P.code, {x: W - M - 260, family: SANS, size: 36});
    y = 700;
    line('新汉语水平考试', {center: true, size: 72, bold: true, height: 140});
    line('HSK（三级）', {center: true, size: 72, bold: true, height: 200});
    line('注    意', {center: true, size: 46, bold: true, height: 100});
    line('一、HSK（三级）分三部分：', {x: M + 160});
    line('1. 听力（40题，约35分钟）', {x: M + 220});
    line('2. 阅读（30题，30分钟）', {x: M + 220});
    line('3. 书写（10题，15分钟）', {x: M + 220});
    line('二、听力结束后，有5分钟填写答题卡。', {x: M + 160});
    line('三、全部考试约90分钟（含考生填写个人信息时间5分钟）。', {x: M + 160});
  }

  cover();
  newPage();
  for (const b of P.blocks) {
    switch (b.kind) {
      case 'skill':
        if (y > M + 10) newPage();
        line(b.text, {center: true, size: 46, bold: true, height: LH + 30});
        break;
      case 'part':
        need(LH * 5);
        line(b.text, {bold: true, size: 40, height: LH + 10});
        break;
      case 'between':
        newPage(); y = H / 2 - 100;
        line(b.text, {center: true, size: 46, bold: true});
        newPage();
        break;
      case 'pictures':
        pictureBlock(b);
        break;
      case 'statements':
        range(b.start, b.end); example(b.example);
        b.items.forEach((s, i) => numbered(b.start + i, `★ ${s}`, {bracket: true}));
        break;
      case 'choices':
        range(b.start, b.end); example(b.example);
        b.items.forEach((opts, i) => choiceRow(opts, M + 90, b.start + i));
        break;
      case 'matching':
        range(b.start, b.end);
        b.options.forEach((o, i) => {
          need(LH);
          text(String.fromCharCode(65 + i), M + 20, {family: SANS, size: 36});
          text(o, M + 80);
          y += LH;
        });
        y += 20; example(b.example);
        b.items.forEach((s, i) => numbered(b.start + i, s, {bracket: true}));
        break;
      case 'wordbank':
        range(b.start, b.end);
        choiceRow(b.options, M + 20);
        y += 20; example(b.example);
        b.items.forEach((lines, i) => {
          need(LH * lines.length);
          text(`${b.start + i}.`, M, {family: SANS, size: 36});
          lines.forEach((l) => { text(l, M + 90); y += LH; });
          y += 10;
        });
        break;
      case 'passages':
        range(b.start, b.end); example(b.example);
        b.items.forEach((it, i) => {
          need(LH * 4);
          numbered(b.start + i, it.passage);
          line(`★ ${it.question}`, {x: M + 90});
          choiceRow(it.options, M + 90);
          y += 16;
        });
        break;
      case 'reorder':
        range(b.start, b.end); example(b.example);
        b.items.forEach((pieces, i) => {
          need(LH * 2);
          text(`${b.start + i}.`, M, {family: SANS, size: 36});
          let x = M + 110;
          pieces.forEach((p) => { text(p, x); font(FS); x += ctx.measureText(p).width + 90; });
          y += LH * 2;
        });
        break;
      case 'pinyin':
        range(b.start, b.end); example(b.example);
        b.items.forEach((it, i) => {
          need(LH * 2.4);
          const x = M + 90;
          const gap = it.sentence.indexOf('（');
          font(FS);
          const gx = x + ctx.measureText(it.sentence.slice(0, gap)).width;
          text(it.pinyin, gx + 12, {family: SANS, size: 32});
          y += 52;
          text(`${b.start + i}.`, M, {family: SANS, size: 36});
          text(it.sentence, x);
          y += LH * 1.6;
        });
        break;
    }
  }

  // Footers: the paper code and the page number, as on the real paper.
  pages.forEach((c, i) => {
    const g = c.getContext('2d');
    g.font = `30px ${SANS}`; g.fillStyle = '#151515';
    const s = `${P.code} - ${i + 1}`;
    g.fillText(s, (W - g.measureText(s).width) / 2, H - 90);
  });

  // Scan look: paper tone, a slight tilt, a little blur, noise; JPEG.
  const out = pages.map((c, i) => {
    const s = document.createElement('canvas');
    s.width = W; s.height = H;
    const g = s.getContext('2d');
    g.fillStyle = 'rgb(247,246,242)';
    g.fillRect(0, 0, W, H);
    g.translate(W / 2, H / 2);
    g.rotate(((i % 3) - 1) * 0.0045);
    g.translate(-W / 2, -H / 2);
    g.filter = 'blur(0.7px)';
    g.globalCompositeOperation = 'multiply';
    g.drawImage(c, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.setTransform(1, 0, 0, 1, 0, 0);
    const im = g.getImageData(0, 0, W, H);
    const d = im.data;
    for (let k = 0; k < d.length; k += 4) {
      const n = (rnd() - 0.5) * 22;
      d[k] = Math.max(0, Math.min(255, d[k] + n));
      d[k + 1] = Math.max(0, Math.min(255, d[k + 1] + n));
      d[k + 2] = Math.max(0, Math.min(255, d[k + 2] + n));
    }
    g.putImageData(im, 0, 0);
    if (location.hash === '#show') document.body.appendChild(s);
    return s.toDataURL('image/jpeg', 0.72);
  });
  document.getElementById('out').textContent = JSON.stringify({width: W, height: H, pages: out});
})();
</script>
</body>
</html>
